name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # gofmt is not optional (CLAUDE.md). Nothing checked this before STE-94;
      # six files had already drifted by the time STE-73 found them.
      - run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # Build-tagged files are invisible to a plain vet. Without this, the
      # integration tests can stop compiling and nothing notices — which is
      # exactly what happened to STE-59's AC1/AC4.
      - run: go vet -tags integration ./...
      - run: go build ./...
      # -race is required for the concurrency tests to mean anything; the
      # GitHubAdapter.account race (STE-84) passes without it.
      - run: go test -race ./...
