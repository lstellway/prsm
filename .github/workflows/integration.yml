name: Integration

# The integration-tagged tests hit the real GitHub API and need a PAT, so they
# cannot run on pull requests: secrets are not exposed to fork PRs, and a green
# "skipped" run would be indistinguishable from a passing one.
#
# They run on a schedule instead, plus on demand. CI proves they still compile
# (go vet -tags integration); this proves they still pass against live GitHub.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # The tests call t.Skip when GITHUB_TOKEN is empty, so a missing secret
      # would produce a green run that tested nothing. Fail loudly instead —
      # prsm's own rule is never a silent no-op.
      - name: Require integration token
        env:
          INTEGRATION_GITHUB_TOKEN: ${{ secrets.INTEGRATION_GITHUB_TOKEN }}
        run: |
          if [ -z "$INTEGRATION_GITHUB_TOKEN" ]; then
            echo "::error::Secret INTEGRATION_GITHUB_TOKEN is not set. The integration tests would silently skip."
            echo "Add a PAT with public_repo scope at Settings → Secrets and variables → Actions."
            exit 1
          fi

      # A classic PAT is required. The workflow's own GITHUB_TOKEN is an app
      # installation token, and GET /user returns 403 for those, so
      # TestResolveIdentity cannot pass with it. GitHub also reserves the name
      # GITHUB_TOKEN for repository secrets, hence the separate secret name
      # mapped onto the env var the tests read.
      - name: Run integration tests
        env:
          GITHUB_TOKEN: ${{ secrets.INTEGRATION_GITHUB_TOKEN }}
        run: go test -tags integration -race -v ./...
